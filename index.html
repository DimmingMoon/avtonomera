const PT=[[1,500],[2.5,2000],[10,15000],[60,250000],[400,5e6],[3000,15e6],[24000,45e6]];
function pp(P){if(P<=1)return 500;if(P>=24000)return 45e6*Math.pow(P/24000,.5);let k=1;while(P>PT[k][0])k++;const[a,b]=PT[k-1],[c,d]=PT[k];return Math.exp(Math.log(b)+(Math.log(P)-Math.log(a))/(Math.log(c)-Math.log(a))*(Math.log(d)-Math.log(b)))}
function price(p,ri_,code,P,why,cu){const R=cu||RG[ri_];let m=R.m,w=[...why];
 const cm=code=='777'?1.6:code.length==3?1.15:1;
 w.push(`Регион ${R.n} (${code}): наценка ×${+(m*cm).toFixed(2)}`+(code=='777'?' — код «777» особенно ценится':code.length==3?' — трёхзначный код дороже':''));
 let x=m*cm;const d=p.slice(1,4);
 if(/^(\d)\1\1$/.test(d)&&code.split('').every(ch=>ch==d[0])){x*=1.4;w.push('Цифры совпадают с кодом региона ('+d+' / '+code+') — ×1.4')}
 const pr=Math.round(pp(P)*x*(.85+Math.random()*.4)/100)*100||100;return{price:Math.max(100,pr),why:w}}
// ---------- генерация под редкость ----------
const D={rnd:()=>''+ri(0,9)+ri(0,9)+ri(0,9),pal:()=>{const a=ri(0,9);let b;do b=ri(0,9);while(b==a);return ''+a+b+a},
 seq:()=>{const a=ri(1,7);return Math.random()<.6?''+a+(a+1)+(a+2):''+(a+2)+(a+1)+a},round:()=>ri(1,9)+'00',tri:()=>{const n=ri(1,9);return ''+n+n+n},
 s777:()=>'777',zero:()=>'00'+pick([2,3,4,5,6,8,9]),s001:()=>'001',s000:()=>'000',s007:()=>'007'};
const LT={rnd:()=>rl()+rl()+rl(),pal:()=>{const a=rl(),b=rl();return a+b+a},dbl:()=>{const a=rl(),b=rl();return a+b+b},same:()=>{const a=rl();return a+a+a},
 gov:()=>pick(GOV),word:()=>pick(WORDS)};
const GEN=[[['rnd','rnd']],[['pal','rnd'],['rnd','pal'],['rnd','dbl']],
 [['seq','rnd'],['round','rnd'],['tri','rnd'],['rnd','gov'],['pal','word'],['seq','pal']],
 [['s777','rnd'],['zero','rnd'],['tri','same'],['round','same']],
 [['s777','same'],['zero','same'],['tri','gov'],['s007','dbl'],['s000','rnd']],
 [['s001','same'],['s000','same'],['s007','same'],['s777','gov'],['s001','gov']]];
function genPlate(t){let p;for(let i=0;i<60;i++){const[d,l]=pick(GEN[t]),ls=LT[l]();p=ls[0]+D[d]()+ls[1]+ls[2];if(rar(power(p).P)==t)return p}return p}
function build(p,ri_,code,forceR,forcePrice,cu){const{P,why}=power(p),q=price(p,ri_,code,P,why,cu);
 return{id:++S.seq,plate:p,reg:ri_,rn:(cu||RG[ri_]).n,code,r:forceR>=0?forceR:rar(P),price:forcePrice||q.price,why:q.why,t:Date.now(),safe:false}}
function rollRar(){const t=S.w.reduce((a,b)=>a+b,0);let x=Math.random()*t;for(let i=0;i<6;i++){if((x-=S.w[i])<0)return i}return 0}
const avgM=()=>RG.reduce((a,r)=>a+r.m,0)/RG.length;
const cost=()=>Math.round(BASE*(S.reg<0?avgM():RG[S.reg].m)/100)*100;
function plateHTML(p,code,col){return `<div class="plate" style="--rc:${col||'transparent'}"><div class="n">${p[0]} ${p.slice(1,4)} ${p.slice(4)}</div><div class="r"><b>${code}</b><i>RUS</i></div></div>`}
// ---------- звук ----------
let ac;function beep(r){if(!S.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const f=[300,380,480,560,700,880][r];
 const n=r>=3?3+r-3:1;for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.type=r>=4?'triangle':'sine';o.frequency.value=f*(1+i*.25);
 g.gain.setValueAtTime(S.vol*.25,ac.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.12+.3);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.32)}}catch(e){}}
function tick(){if(!S.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=200+Math.random()*200;g.gain.value=S.vol*.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.03)}catch(e){}}
function countUp(el,v,ms){const k=el._k=(el._k||0)+1,t0=performance.now();(function f(n){const x=ms>0?Math.min(1,(n-t0)/ms):1,e=x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;el.textContent=fmt(v*e);if(x<1&&el._k==k&&el.isConnected)requestAnimationFrame(f)})(t0)}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',1800)}
// ---------- крутка ----------
let ovOpen=false,lock=false,timers=[];
function roll(){if(ovOpen)return;let it;
 if(nOut()>=cap()){toast('Склад заполнен ('+cap()+'). Продай номера или расширь склад');return}
 if(S.q.length){it=S.q.shift();it.id=++S.seq;it.t=Date.now()}
 else{const c=cost();if(S.money<c){toast('Не хватает денег — продай номера или возьми подработку');return}
 S.money-=c;const tw=S.w.reduce((a,b)=>a+b,0)||1;
 if(Math.random()<S.w[4]*S.pk/tw){const pc=pick(PH);it=build(genPlate(Math.random()<.8?4:5),0,pc,-1,0,{n:'Несуществующий регион',m:3});it.why.push('Код «'+pc+'» не существует в реальности — коллекционный номер-фантом, ценится выше обычных')}
 else{const rg=S.reg<0?Math.floor(Math.random()*RG.length):S.reg,R=RG[rg],code=(S.reg>=0&&S.cd)||pick(R.c);it=build(genPlate(rollRar()),rg,code,-1)}}
 S.items.push(it);save();ui();it.r>=3?showOv(it):show(it)}
const whyHTML=w=>'<ul class="why">'+w.map(x=>`<li>${x}</li>`).join('')+'</ul>';
function show(it,na){const col=`var(${RC[it.r]})`,res=$('res');res.className='res';void res.offsetWidth;res.className='res pop';
 res.style.setProperty('--rc',col);res.innerHTML=plateHTML(it.plate,it.code,col)+`<div class="tag" style="color:${col}">${RN[it.r]}</div><div class="price"><span id="pv">0</span> ₽ · ${it.rn||RG[it.reg].n}</div>`+whyHTML(it.why);beep(it.r);countUp($('pv'),it.price,na?0:1100)}
function showOv(it){const col=`var(${RC[it.r]})`,o=$('ov');
 const dur=[0,0,0,3.5,6,9][it.r]+Math.min(3,Math.max(0,Math.log10(it.price/1e6))*1.2);
 timers.forEach(t=>{clearTimeout(t)});timers=[];ovOpen=lock=true;
 o.style.setProperty('--rc',col);o.className='ov show'+(it.r==5?' div':'');
 $('ovT').textContent='Крутится…';$('ovC').innerHTML='<span id="ovV">0</span> ₽ · '+(it.rn||RG[it.reg].n);countUp($('ovV'),it.price,dur*950);$('ovW').innerHTML='';$('ovH').textContent='Подожди, пропустить нельзя';
 const bar=$('bar');bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;bar.style.transition=`width ${dur}s linear`;bar.style.width='100%';
 const stop=dur*.6*1000,t0=performance.now();
 (function spin(){const e=performance.now()-t0;if(e>=stop){reveal();return}
  $('ovP').innerHTML=plateHTML(rl()+D.rnd()+rl()+rl(),it.code,col);tick();timers.push(setTimeout(spin,50+300*Math.pow(e/stop,3)))})();
 function reveal(){$('ovP').innerHTML=plateHTML(it.plate,it.code,col);beep(it.r);$('ovT').textContent=it.r==5?'БОЖЕСТВЕННЫЙ НОМЕР!':RN[it.r]+'!';
  
  $('ovW').innerHTML=it.why.map((x,i)=>`<li style="animation-delay:${i*.7}s">${x}</li>`).join('')}
 timers.push(setTimeout(()=>{lock=false;$('ovH').textContent='Нажми, чтобы закрыть'},dur*1000))}
function closeOv(){if(lock)return;$('ov').className='ov';show(S.items[S.items.length-1],1);setTimeout(()=>ovOpen=false,50)}
$('ov').onclick=e=>{e.stopPropagation();closeOv()};
document.addEventListener('click',e=>{if(ovOpen||e.target.closest('button,select,input,label,.modal,.sel,header'))return;roll()});
document.addEventListener('keydown',e=>{if(e.code=='Space'&&!ovOpen&&!document.querySelector('.modal.show')&&!e.target.closest('button,input,select')){e.preventDefault();roll()}});
// ---------- интерфейс ----------
function ui(){$('bal').textContent=fmt(S.money)+' ₽';$('qn').textContent=S.q.length?' · очередь: '+S.q.length:'';$('cost').textContent=fmt(cost())+' ₽';
 if($('mWh').classList.contains('show'))wh()}
function rname(){if(S.reg<0)return 'Все регионы';const r=RG[S.reg];return r.n+' ('+r.c.slice(0,3).join(', ')+(r.c.length>3?'…':'')+') · ×'+r.m}
function rlist(q){q=(q||'').trim().toLowerCase();const a=RG.map((r,i)=>[r,i]).filter(([r])=>!q||r.n.toLowerCase().includes(q)||r.c.some(c=>c.startsWith(q)));
 const all=(!q||'все регионы'.includes(q))?`<div class="ro${S.reg<0?' on':''}" data-i="-1"><b>Все регионы</b> <span>случайный регион при каждой крутке · ×${+avgM().toFixed(2)}</span></div>`:'';
 $('rl').innerHTML=all+(a.length?a.map(([r,i])=>`<div class="ro${i==S.reg?' on':''}" data-i="${i}"><b>${r.n}</b> <span>${r.c.join(', ')} · ×${r.m}</span></div>`).join(''):all?'':'<div class="ro">Ничего не найдено</div>')}
function drop(){$('rq').value=rname();codes()}
function codes(){if(S.reg<0){$('selC').innerHTML='<option value="">Код: случайный</option>';$('selC').disabled=true;return}$('selC').disabled=false;const R=RG[S.reg];$('selC').innerHTML=`<option value="">Любой код региона</option>`+R.c.map(c=>`<option value="${c}"${c==S.cd?' selected':''}>Код ${c}${c=='777'?' · дороже':''}</option>`).join('')}
$('rq').onfocus=e=>{e.target.select();rlist('');$('rl').style.display='block'};
$('rq').oninput=e=>{rlist(e.target.value);$('rl').style.display='block'};
$('rq').onblur=()=>setTimeout(()=>{$('rl').style.display='none';$('rq').value=rname()},250);
$('rl').onclick=e=>{const o=e.target.closest('[data-i]');if(!o)return;S.reg=+o.dataset.i;S.cd='';save();codes();ui();$('rq').value=rname();$('rl').style.display='none';$('rq').blur()};
$('selC').onchange=e=>{S.cd=e.target.value;save()};
$('bonus').onclick=()=>{S.money+=5000;save();ui()};
function wh(){const tab=$('tab').value,so=$('sort').value,fr=+$('fr').value;
 let a=S.items.filter(i=>(tab=='all'||(tab=='safe')==i.safe)&&(fr<0||i.r==fr));
 const f={new:(x,y)=>y.id-x.id,old:(x,y)=>x.id-y.id,pd:(x,y)=>y.price-x.price,pa:(x,y)=>x.price-y.price,rd:(x,y)=>y.r-x.r||y.price-x.price}[so];a.sort(f);
 const tot=a.reduce((s,i)=>s+i.price,0);$('whInfo').textContent=`Показано: ${a.length} · стоимость ${fmt(tot)} ₽`;
 $('capInfo').textContent=`Склад ${nOut()}/${cap()} · Сейф ${nSafe()}/${SAFE}`;$('upg').textContent=`Расширить +${UPS} · ${fmt(upCost())} ₽`;
 $('items').innerHTML=a.length?a.map(i=>`<div class="it${i.safe?' safe':''}" style="--rc:var(${RC[i.r]})">${plateHTML(i.plate,i.code)}<div><b style="color:var(${RC[i.r]})">${RN[i.r]}</b> <span class="mut">${i.rn||RG[i.reg].n}</span><br><span class="price">${fmt(i.price)} ₽</span></div>
 <div class="row"><button class="btn" data-s="${i.id}">${i.safe?'Достать из сейфа':'В сейф'}</button>${i.safe?'':`<button class="btn pri" data-sell="${i.id}">Продать</button>`}</div>${whyHTML(i.why)}</div>`).join(''):'<div style="color:var(--mut)">Здесь пока пусто. Нажми на экран, чтобы получить номер.</div>'}
$('items').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.s){const i=S.items.find(x=>x.id==b.dataset.s);
  if(!i.safe&&nSafe()>=SAFE){toast('Сейф полон: максимум '+SAFE+' номеров');return}
  if(i.safe&&nOut()>=cap()){toast('Склад заполнен — сначала освободи место');return}
  i.safe=!i.safe}
 if(b.dataset.sell){const k=S.items.findIndex(x=>x.id==b.dataset.sell);S.money+=S.items[k].price;S.items.splice(k,1)}
 save();ui();wh()};
$('sellAll').onclick=()=>{const a=S.items.filter(i=>!i.safe&&(+$('fr').value<0||i.r==+$('fr').value));if(!a.length){toast('Нечего продавать: всё в сейфе или скрыто фильтром');return}
 const sum=a.reduce((s,i)=>s+i.price,0),b=$('sellAll');
 if(!b._arm){b._arm=1;b.textContent=`Точно? Продать ${a.length} шт. за ${fmt(sum)} ₽`;clearTimeout(b._h);b._h=setTimeout(()=>{b._arm=0;b.textContent='Продать всё не в сейфе'},4000);return}
 b._arm=0;b.textContent='Продать всё не в сейфе';clearTimeout(b._h);
 const ids=new Set(a.map(i=>i.id));S.money+=a.reduce((s,i)=>s+i.price,0);S.items=S.items.filter(i=>!ids.has(i.id));save();ui();toast('Продано: '+a.length+' шт. за '+fmt(sum)+' ₽')};
['tab','sort','fr'].forEach(i=>$(i).onchange=wh);
$('upg').onclick=()=>{const c=upCost();if(S.money<c){toast('Не хватает денег: нужно '+fmt(c)+' ₽');return}S.money-=c;S.up++;save();ui();wh();toast('Склад расширен до '+cap())};
$('fr').innerHTML+=RN.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
const open=id=>{$(id).classList.add('show');if(id=='mWh')wh()};
$('bWh').onclick=()=>open('mWh');$('bSet').onclick=()=>{$('snd').checked=S.snd;$('vol').value=S.vol;open('mSet')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target==m)m.classList.remove('show')});
$('snd').onchange=e=>{S.snd=e.target.checked;save()};$('vol').oninput=e=>{S.vol=+e.target.value;save()};
$('reset').onclick=()=>{const b=$('reset');if(!b._arm){b._arm=1;b.textContent='Точно удалить? Нажми ещё раз';setTimeout(()=>{b._arm=0;b.textContent='Сбросить прогресс'},4000);return}b._arm=0;b.textContent='Сбросить прогресс';S=null;try{localStorage.removeItem(KEY)}catch(e){}load();save();drop();ui()};
$('codeOk').onclick=()=>{if($('code').value.trim().toUpperCase()==CODE){$('code').value='';$('mSet').classList.remove('show');adm();open('mAd')}else toast('Неверный код')};
// ---------- меню автора ----------
function pct(){const t=S.w.reduce((a,b)=>a+b,0)||1;return S.w.map(w=>+(w/t*100).toFixed(4)+'%')}
function adm(){phInit();$('rgl').innerHTML=RG.map(r=>`<option value="${r.n}">${r.c.join(', ')}</option>`).join('');
 const p=pct();$('adCh').innerHTML=RN.map((n,i)=>`<label class="row" style="justify-content:space-between"><span style="color:var(${RC[i]})">${n} <small id="pc${i}" style="color:var(--mut)">${p[i]}</small></span><input type="number" min="0" step="any" data-w="${i}" value="${S.w[i]}" style="width:120px"></label>`).join('')}
$('adCh').oninput=e=>{const i=e.target.dataset.w;if(i!=null){S.w[i]=Math.max(0,+e.target.value||0);if(!S.w.some(x=>x>0))S.w[0]=1;save();pct().forEach((x,k)=>$('pc'+k).textContent=x);phPct()}};
$('adRs').onclick=()=>{S.w=DEFW.slice();S.pk=.5;save();adm()};
function phPct(){const t=S.w.reduce((a,b)=>a+b,0)||1,p=S.w[4]*S.pk/t;$('phPc').textContent=p>0?'= '+(p*100).toFixed(5)+'% (1 из '+fmt(1/p)+')':'= 0%'}
function phInit(){$('phl').innerHTML=PH.map(c=>`<option value="${c}">`).join('');$('phK').value=S.pk;phPct()}
$('phK').oninput=e=>{S.pk=Math.max(0,+e.target.value||0);save();phPct()};
$('phG').onclick=()=>{let p=$('phP').value.toUpperCase().replace(/[^A-ZА-Я0-9]/g,'');
 if(p&&!/^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}$/.test(p)){toast('Формат: А777АА (буквы АВЕКМНОРСТУХ)');return}
 if(!p)p=genPlate(Math.random()<.8?4:5);
 const pc=($('phC').value.trim().toUpperCase())||pick(PH);
 const it=build(p,0,pc,-1,0,{n:'Несуществующий регион',m:3});it.why.push('Код «'+pc+'» не существует в реальности — коллекционный номер-фантом, ценится выше обычных');
 S.q.push(it);save();ui();toast('Фантом в очереди: '+RN[it.r]+' · '+fmt(it.price)+' ₽')};
$('adMb').onclick=()=>{S.money+=+$('adM').value||0;save();ui()};
$('adG').onclick=()=>{const p=$('adP').value.toUpperCase().replace(/[^A-ZА-Я0-9]/g,'');if(!/^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}$/.test(p)){toast('Формат: А777АА (буквы АВЕКМНОРСТУХ)');return}
 const raw=$('adR').value.trim(),t=raw.toLowerCase(),cd=$('adC').value.trim().toUpperCase();let i=RG.findIndex(r=>r.n.toLowerCase()==t||(t&&r.c.includes(t))),cu=null,code=cd;
 if(i<0){cu={n:raw||'Свой регион',m:+$('adM2').value||1};code=cd||(t&&t.length<=4?t.toUpperCase():'00');i=0}
 else code=cd||(RG[i].c.includes(t)?t:RG[i].c[0]);
 const it=build(p,i,code,-1,+$('adPr').value||0,cu);S.q.push(it);save();ui();toast('В очереди: '+RN[it.r]+' · '+fmt(it.price)+' ₽ — выпадет при следующем нажатии')};
load();drop();ui();
</script></body></html>
